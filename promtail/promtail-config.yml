
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 262144

scrape_configs:
  - job_name: ecommerce-docker

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values:
              - com.docker.compose.project=ecommerce-devops

    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        regex: ecommerce-devops
        action: keep

      - source_labels:
          - __meta_docker_container_name
        regex: '/(.*)'
        target_label: container

      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service

      - target_label: job
        replacement: ecommerce-docker

    pipeline_stages:
      - drop:
          older_than: 24h
          drop_counter_reason: old_logs
