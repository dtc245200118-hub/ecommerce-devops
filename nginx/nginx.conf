events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Giới hạn kích thước request mặc định
    client_max_body_size 1m;

    # Resolver nội bộ Docker: phân giải upstream khi có request,
    # Nginx vẫn khởi động được dù một dịch vụ giám sát chưa sẵn sàng
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =====================================
    # RATE LIMITING
    # =====================================
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Mọi thiết lập TLS dùng chung cho các server bên dưới
    include /etc/nginx/snippets/ssl.conf;

    # =====================================
    # HTTP -> HTTPS REDIRECT
    # =====================================
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # =====================================
    # 1. WEBSITE THƯƠNG MẠI ĐIỆN TỬ - https://localhost
    # =====================================
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

        set $backend http://backend:3000;

        # Đăng nhập / đăng ký: giới hạn chặt để chống brute-force
        location ~* ^/api/auth/(login|register)/?$ {
            limit_req zone=auth_limit burst=10 nodelay;

            include /etc/nginx/snippets/proxy.conf;
            proxy_hide_header Content-Security-Policy;
            proxy_pass $backend;
        }

        location ~* ^/api/ {
            limit_req zone=api_limit burst=60 nodelay;

            include /etc/nginx/snippets/proxy.conf;
            proxy_hide_header Content-Security-Policy;
            proxy_pass $backend;
        }

        location / {
            include /etc/nginx/snippets/proxy.conf;
            proxy_hide_header Content-Security-Policy;
            proxy_pass $backend;
        }
    }

    # =====================================
    # 2. PHPMYADMIN - https://localhost:8081 (Đăng nhập MySQL trực tiếp)
    # =====================================
    server {
        listen 8081 ssl;
        http2 on;
        server_name localhost;

        include /etc/nginx/snippets/security-headers.conf;
        error_page 497 =301 https://$host:8081$request_uri;

        # Cho phép import file SQL
        client_max_body_size 64m;

        location / {
            set $phpmyadmin http://phpmyadmin:80;
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass $phpmyadmin;
        }
    }
}
